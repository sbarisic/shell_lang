name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore shell_lang.slnx
      - name: Build
        run: dotnet build shell_lang.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test shell_lang.slnx --configuration Release --no-build
      - name: Run bootstrap example
        run: dotnet run --project shell_lang_test --configuration Release --no-build -- --example
